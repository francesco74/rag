# Project file: nginx.conf (This will become /etc/nginx/conf.d/default.conf)

server {
    listen 80;
    server_name _;

    # I file di Flutter hanno sempre lo stesso nome: il browser li ricontrolla a ogni
    # apertura (ETag, 304 se non sono cambiati), altrimenti resterebbe sulla versione vecchia.
    add_header Cache-Control "no-cache" always;

    # Set the root directory for your Flutter files
    root /usr/share/nginx/html;

    # Configuration for Single Page Applications (SPAs) like Flutter
    # Tries to find the requested file, otherwise falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Prevent access to dotfiles (like .env)
    location ~ /\. {
        deny all;
    }
}