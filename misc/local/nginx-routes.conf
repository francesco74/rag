# Rotte comuni a tutti i siti.
location /api/ {
    set $api http://api:5000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
}
location /amministrazione/ {
    set $rev http://revisione:80;
    rewrite ^/amministrazione/(.*)$ /$1 break;
    proxy_pass $rev;
}
location = /amministrazione {
    return 301 /amministrazione/;
}

# File originali: l'API autorizza e risponde con X-Accel-Redirect.
location /_protected_files/ {
    internal;
    alias /data/processed/;
}
location / {
    proxy_pass $site;
}
