# Gateway locale: stesse regole di k8s/nginx.yaml, un solo server: il sito lo riconosce il backend dal dominio.
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Risolve i nomi a ogni richiesta: i servizi possono ripartire con un altro IP.
    resolver 127.0.0.11 valid=5s;
    absolute_redirect off;
    client_max_body_size 110m;
    proxy_read_timeout 300;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8081;
        set $site http://chat:80;
        include /etc/nginx/rag-routes.conf;
    }
}
