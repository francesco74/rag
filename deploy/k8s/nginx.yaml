apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: rag
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }
    http {
        # Cluster IP di CoreDNS: i nomi dei servizi si risolvono ogni 5 secondi,
        # così un pod ricreato (nuovo IP) è raggiunto senza riavviare nginx.
        resolver 10.96.0.10 valid=5s;

        upstream revisione {
           zone revisione_zone 64k;
           server revisione.rag.svc.cluster.local:80 resolve;
        }
        upstream api_rag {
           zone api_zone 64k;
           server api.rag.svc.cluster.local:5000 resolve;
        }
        upstream web_chat {
           zone web_zone 64k;
           server web-chat.rag.svc.cluster.local:80 resolve;
        }

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        server {
            # Tutti i domini: il sito lo riconosce l'API dal nome (tabella chat_sites).
            listen 8080 default_server;
            server_name _;

            port_in_redirect off;
            # Redirect relativi (Location: /amministrazione/): il TLS termina
            # sull'ingress, quindi un redirect assoluto qui sarebbe http://.
            absolute_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            location /api/ {
                rewrite ^/api/(.*)$ /$1 break;
                proxy_pass http://api_rag;
                client_max_body_size 110m;  # UPLOAD_MAX_MB e CONVERT_MAX_UPLOAD_MB
                proxy_connect_timeout 300;
                proxy_send_timeout 300;
                proxy_read_timeout 300;
            }

            location /amministrazione/ {
                rewrite ^/amministrazione/(.*)$ /$1 break;
                proxy_pass http://revisione;
                proxy_connect_timeout 300;
                proxy_send_timeout 300;
                proxy_read_timeout 300;
            }

            location = /amministrazione {
              return 301 /amministrazione/;
            }

            # Documenti originali: l'accesso lo decide l'API (/api/files/...,
            # archivi pubblici o riservati), che risponde con X-Accel-Redirect
            # verso questa location (FILES_X_ACCEL_PREFIX). "internal": il browser
            # non può aprirla direttamente, quindi niente elenco della cartella,
            # niente .md e .json, niente accesso agli archivi riservati.
            location /_protected_files/ {
                internal;
                alias /data/processed/;
            }

            # Vecchi link delle chat (/downloads/<topic>/<sub>/<file>):
            # rimandati all'API, che applica le regole di accesso.
            location /downloads/ {
                rewrite ^/downloads/(.*)$ /api/files/$1 permanent;
            }

            location / {
              proxy_pass http://web_chat;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: rag
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 8080
          name: http-proxy
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        # Documenti originali, inviati da nginx su X-Accel-Redirect dell'API
        - name: rag-storage
          mountPath: /data
          readOnly: true
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf
      - name: rag-storage
        persistentVolumeClaim:
          claimName: rag-storage
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: rag
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
