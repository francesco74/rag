apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rag
  labels:
    app: api
spec:
  replicas: 1 # You can scale this up easily (e.g., 3) without high memory costs
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
      - name: provincia-regcreds
      # Come converter e ingestion: i file caricati dall'amministrazione e i manifest
      # corretti in revisione devono poter essere spostati e riscritti da loro.
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: registry.intranet.provincia.lucca/rag/rest:v4.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: rag-config
        - secretRef:
            name: rag-secrets
        # Resources can be small for the API
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            # caricamenti fino a UPLOAD_MAX_MB (100) tenuti in memoria durante il controllo
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: rag-storage
          mountPath: /data
      volumes:
      - name: rag-storage
        persistentVolumeClaim:
          claimName: rag-storage
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rag
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
