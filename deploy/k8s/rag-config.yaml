apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag
data:
  # Riferimenti ai servizi interni al cluster nel namespace 'rag'
  REDIS_HOST: "redis.rag.svc.cluster.local"
  REDIS_PORT: "6379"
  BROKER_PORT: "5672"
  BROKER_HOST: "rabbitmq.rag.svc.cluster.local"
  BROKER_USERNAME: "default_user_tShv0hPR-8CASRQf3Wf" 
  QDRANT_HOST: "qdrant.rag.svc.cluster.local"
  QDRANT_PORT: "6333"
  # Parametri di calibrazione pipeline RAG
  RERANK_SIZE: "25"
  QDRANT_SEMANTIC_THRESHOLD: "0.60"
  MYSQL_SERVICE_HOST: "mysql.rag.svc.cluster.local"
  MYSQL_SERVICE_PORT: "3306"
  MYSQL_USER: "raguser"
  MYSQL_DATABASE: "rag"
  LOG_LEVEL: "DEBUG"
  MAX_CONTEXT_CHARS: "150000"
  QDRANT_CONCEPT_THRESHOLD: "0.80"
  MAX_SUB_QUERIES: "5"
  PARENT_BUDGET_RATIO: "0.80"
  ALLOWED_ORIGINS: "http://localhost:3000"
  DOCWS_RICERCA_ENDPOINT: "https://provincialucca.sicraweb.maggioli.cloud/client/services/DocWSRicercheSoap12"
  DOCWS_ATTI_ENDPOINT: "https://provincialucca.sicraweb.maggioli.cloud/client/services/WSattiSoap"
  DOCWS_CODICE_AMMINISTRAZIONE: "p_LU"
  DOCWS_CODICE_AOO: "AOOPLU"
  WS_USERNAME: "utente@wsprotocollo"
  RUOLO_DOCWS: "CED"
  DATA_FOLDER: "/data"

  # --- v4
  # Documenti originali: l'API controlla l'accesso, nginx invia il file dalla
  # location internal /_protected_files/ (nginx.yaml).
  FILES_X_ACCEL_PREFIX: "/_protected_files/"
  # Proxy davanti all'API che aggiungono X-Forwarded-For: ingress + nginx.
  # Serve al blocco dei login ripetuti per indirizzo IP.
  TRUSTED_PROXY_HOPS: "2"
  # Caricamenti dal sito di amministrazione; sotto client_max_body_size di /api/ (110m).
  UPLOAD_MAX_MB: "100"
  OCR_PROVIDER: "gemini"
  # Reranking sul DGX (cross-encoder servito da vLLM, POST <indirizzo>/rerank): l'immagine
  # rest non contiene il reranker locale mmarco (vedi deploy/immagini.sh, MODELLI_LOCALI).
  # Il nome è quello con cui vLLM pubblica il modello (--served-model-name).
  RERANK_PROVIDER: "vllm"
  RERANK_MODEL_NAME: "bge-reranker-v2-m3"
  LOCAL_VLLM_RERANK_BASE_URL: "http://10.1.1.132:8001/v1"
  # La selezione delle sottocategorie (ALLOW_SUBTOPIC_SELECTION) ora è un'impostazione
  # di ogni sito. WS_PASSWORD è passata in rag-secrets.

  LLM_PROVIDER: "gemini"
  OCR_MODEL_NAME: "gemini-3.7-flash"
  QUERY_REWRITER_MODEL_NAME: "gemini-3.5-flash-lite"
  ANSWER_GENERATOR_MODEL_NAME: "gemini-3.7-flash"
  GRADER_MODEL_NAME: "gemini-3.5-flash-lite"
  RERANK_BATCH_SIZE: "4"

  CPU_LIMIT: "4"
  CELERY_CONCURRENCY: "2"
  RERANKER_POOL_SIZE: "2"
  GRADER_THINKING_LEVEL: "MINIMAL"    # opzionale, è già il default
  ANSWER_THINKING_LEVEL: "LOW"
