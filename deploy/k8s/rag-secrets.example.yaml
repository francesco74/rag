# Copiare in rag-secrets.yaml (escluso da git) e mettere i valori veri, oppure crearlo con
#   kubectl -n rag create secret generic rag-secrets --from-literal=MYSQL_ROOT_PASSWORD=... ...
# Con stringData i valori si scrivono in chiaro: Kubernetes li codifica da solo.
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: ""
  MYSQL_PASSWORD: ""
  API_SECRET_KEY: ""
  # Firma delle sessioni di amministrazione e chat: almeno 32 caratteri casuali.
  AUTH_SECRET_KEY: ""
  API_LLM_KEY: ""
  BROKER_PASSWORD: ""
  # Web service di Sicr@Web (prima era nella ConfigMap rag-config).
  WS_PASSWORD: ""
