apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: rag
data:
  custom.cnf: |
    [mysqld]
    innodb_flush_log_at_trx_commit = 2
    max_connections = 500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: rag
spec:
  replicas: 1
  strategy:
    type: Recreate  # FONDAMENTALE PER ROOK-CEPH RBD
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        envFrom:
        - configMapRef:
            name: rag-config
        - secretRef:
            name: rag-secrets
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-config
          mountPath: /etc/mysql/conf.d
      volumes:
      - name: mysql-config
        configMap:
          name: mysql-config
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: rag
spec:
  ports:
  - port: 3306
  selector:
    app: mysql
