# Gateway dell'installazione Docker (come deploy/k8s/nginx.yaml, senza i siti della chat):
# /api/ all'API, /amministrazione/ al sito di amministrazione, file originali dal volume.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Risolve i nomi a ogni richiesta: i servizi possono ripartire con un altro IP.
    resolver 127.0.0.11 valid=5s;
    absolute_redirect off;
    server_tokens off;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    server {
        listen 8080 default_server;
        server_name _;

        location /api/ {
            set $api http://rag-api:5000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
            client_max_body_size 110m;  # UPLOAD_MAX_MB e CONVERT_MAX_UPLOAD_MB
        }

        location /amministrazione/ {
            set $rev http://rag-revisione:80;
            rewrite ^/amministrazione/(.*)$ /$1 break;
            proxy_pass $rev;
        }
        location = /amministrazione {
            return 301 /amministrazione/;
        }

        # File originali: l'API autorizza e risponde con X-Accel-Redirect.
        location /_protected_files/ {
            internal;
            alias /data/processed/;
        }

        # Siti della chat non installati
        location = / {
            return 302 /amministrazione/;
        }
        location / {
            return 404;
        }
    }
}
